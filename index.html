<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Kehadiran OSMIAS</title>
<style>
*{box-sizing:border-box}
:root{
  --blue:#0b5f91;
  --blue2:#167db5;
  --sky:#55c7ee;
  --ink:#0b1b2a;
  --muted:#617386;
  --card:rgba(255,255,255,.88);
  --line:rgba(11,95,145,.12);
}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 5%,rgba(85,199,238,.28),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(11,95,145,.18),transparent 30%),
    linear-gradient(135deg,#f5fbff 0%,#eaf5fb 48%,#f8fbfd 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(11,95,145,.12) 1px,transparent 1px);
  background-size:22px 22px;
}
.wrap{max-width:1180px;margin:auto;padding:28px 20px 45px;position:relative}
.hero{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:24px;
  min-height:220px;padding:30px 34px;margin-bottom:22px;border-radius:28px;
  color:#fff;background:linear-gradient(135deg,#073b61 0%,#0b5f91 52%,#1598cf 100%);
  box-shadow:0 20px 50px rgba(8,74,112,.22);
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero:before{width:300px;height:300px;right:-90px;top:-150px;background:rgba(255,255,255,.13)}
.hero:after{width:180px;height:180px;right:170px;bottom:-120px;background:rgba(85,199,238,.22)}
.logo{
  width:116px;height:116px;object-fit:contain;flex:0 0 auto;
  padding:9px;border-radius:24px;background:rgba(255,255,255,.96);
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  position:relative;z-index:1;
}
.hero-content{position:relative;z-index:1}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;
  padding:6px 11px;border:1px solid rgba(255,255,255,.2);
  border-radius:999px;background:rgba(255,255,255,.12);
  font-size:12px;font-weight:800;letter-spacing:.08em;
}
.hero h1{margin:0 0 7px;font-size:clamp(27px,4vw,42px);letter-spacing:-.03em}
.hero p{margin:0;max-width:650px;color:rgba(255,255,255,.82);line-height:1.6}
.card{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:24px;
  margin-bottom:20px;box-shadow:0 14px 40px rgba(20,69,99,.10);
}
.card h2{margin:0 0 18px;font-size:21px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}
label{display:block;font-weight:800;margin:0 0 7px;font-size:13px;color:#29475c}
input,select,textarea,button{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;
  font:inherit;font-size:15px;outline:none;transition:.2s ease;
}
input,select,textarea{background:rgba(255,255,255,.9);color:var(--ink)}
input:focus,select:focus,textarea:focus{
  border-color:rgba(22,125,181,.55);box-shadow:0 0 0 4px rgba(85,199,238,.15)
}
textarea{min-height:90px;resize:vertical}
button{border:0;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#084d78,#138dca);box-shadow:0 8px 18px rgba(11,95,145,.20)}
button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(11,95,145,.26)}
button.secondary{background:#e8f2f8;color:#0b5f91;box-shadow:none}
button.secondary:hover{background:#dcecf5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.info{margin-top:14px;padding:12px 14px;border-radius:13px;background:#edf7fc;color:#386078;font-size:14px;border:1px solid #d8edf7}
.table{overflow:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px;background:rgba(255,255,255,.72)}
th,td{padding:13px;border-bottom:1px solid #e7eef3;text-align:left}
th{background:#eef8fc;color:#31576e;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f7fcfe}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.03em}
.on{background:#dff8ec;color:#117245}.off{background:#ffe4e4;color:#a12c2c}
.count{font-weight:900;color:#0b5f91;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:#718596;padding:28px}
@media(max-width:700px){
  .wrap{padding:14px 12px 30px}
  .hero{min-height:auto;padding:22px;gap:15px;border-radius:22px}
  .logo{width:82px;height:82px;border-radius:18px;padding:6px}
  .hero h1{font-size:25px}.hero p{font-size:13px}
  .grid,.actions{grid-template-columns:1fr}.full{grid-column:auto}
  .card{padding:18px;border-radius:20px}
}
</style>
</head>

  <div class="hero-content">
    <div class="eyebrow">OSMIAS • MA'HAD I HYA ASSUNNAH</div>
    <h1>Data Kehadiran OSMIAS</h1>
    <p>Pencatatan kehadiran dan penggunaan fasilitas secara terpusat, simpel, cepat, dan terhubung online.</p>
  </div>
</section>

<section class="card">
<h2>Form Kehadiran</h2>
<div class="grid">
<div><label>Nama</label><input id="nama" placeholder="Masukkan nama"></div>
<div><label>Kelas</label><input id="kelas" placeholder="Contoh: 11-1"></div>
<div class="full"><label>Keperluan</label><textarea id="keperluan" placeholder="Tuliskan keperluan"></textarea></div>
<div><label>Sampai jam berapa?</label><input id="jamSelesai" type="time"></div>
<div><label>Bidang</label><select id="bidang">
<option value="">-- Pilih Bidang --</option><option>BPH</option><option>KEAMANAN</option><option>IT</option><option>BAHASA</option><option>DAPUR</option><option>KESEHATAN</option><option>IBADAH</option><option>TARBIYA</option><option>OLAHRAGA</option><option>KEBERSIHAN</option>
</select></div>
</div>
<div class="actions">
<button id="save">Simpan Kehadiran</button>
<button id="notif" class="secondary">🔔 Aktifkan Notifikasi</button>
</div>
<div class="info" id="info">Menghubungkan ke Firebase...</div>
</section>

<section class="card"><h2>Data Kehadiran</h2><div class="table">
<table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Keperluan</th><th>Bidang</th><th>Jam Masuk</th><th>Jam Selesai</th><th>Countdown</th><th>Status</th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="empty">Memuat data...</td></tr></tbody></table>
</div></section>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getMessaging,getToken,isSupported}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

const firebaseConfig={
apiKey:"AIzaSyAQADtZHicDIKHDxT1D-VV9MBUQnkY1h-4",
authDomain:"data-base-kehadiran-osmias.firebaseapp.com",
projectId:"data-base-kehadiran-osmias",
storageBucket:"data-base-kehadiran-osmias.firebasestorage.app",
messagingSenderId:"38210140577",
appId:"1:38210140577:web:5cefe179fa119515e433e0"
};
const VAPID_KEY="BCp8DfU0VST95P1jA-fW1T9PjT2tCUYRrm-oDWssAkM_NpO1qChrncRKQfTFHO3MGEqrEmHceCpFWtZTpE3kQzo";

const app=initializeApp(firebaseConfig),db=getFirestore(app);
const ref=collection(db,"kehadiran");
const $=id=>document.getElementById(id);
const info=$("info");
let data=[];

function safe(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function jam(v){if(!v)return"-";return new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(v))}
function countdown(ms){if(ms<=0)return"00:00:00";let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(x=>String(x).padStart(2,"0")).join(":")}
function endDate(t){let d=new Date(),[h,m]=t.split(":").map(Number);d.setHours(h,m,0,0);if(d<=new Date())d.setDate(d.getDate()+1);return d}

$("save").onclick=async()=>{
const nama=$("nama").value.trim(),kelas=$("kelas").value.trim(),keperluan=$("keperluan").value.trim(),bidang=$("bidang").value,j=$("jamSelesai").value;
if(!nama||!kelas||!keperluan||!bidang||!j)return alert("Lengkapi semua data terlebih dahulu.");
const masuk=new Date(),selesai=endDate(j);
try{
await addDoc(ref,{nama,kelas,keperluan,bidang,jamMasuk:masuk.toISOString(),jamSelesai:j,waktuSelesai:selesai.getTime(),createdAt:serverTimestamp(),notifiedCount:0});
["nama","kelas","keperluan","jamSelesai","bidang"].forEach(id=>$(id).value="");
info.textContent="✅ Data berhasil disimpan ke Firebase.";
}catch(e){console.error(e);info.textContent="❌ Gagal menyimpan: "+e.message}
};

function render(){
$("rows").innerHTML=data.length?data.map((d,i)=>{
const end=Number(d.waktuSelesai||0),left=end-Date.now(),expired=left<=0;
return `<tr><td>${i+1}</td><td>${safe(d.nama)}</td><td>${safe(d.kelas)}</td><td>${safe(d.keperluan)}</td><td>${safe(d.bidang)}</td><td>${jam(d.jamMasuk)}</td><td>${safe(d.jamSelesai)}</td><td class="count" data-end="${end}">${countdown(left)}</td><td><span class="badge ${expired?"off":"on"}">${expired?"WAKTU HABIS":"AKTIF"}</span></td></tr>`
}).join(""):'<tr><td colspan="9" class="empty">Belum ada data kehadiran.</td></tr>';
}
onSnapshot(query(ref,orderBy("createdAt","desc")),snap=>{data=snap.docs.map(x=>({id:x.id,...x.data()}));render();info.textContent="🟢 Terhubung ke Firebase. Data dibagikan secara online.";},e=>{console.error(e);info.textContent="❌ Firebase belum bisa membaca data: "+e.message});

// ===== NOTIFIKASI OTOMATIS + SUARA =====
const SPAM_INTERVAL=30000; // ulang setiap 30 detik
const MAX_SPAM=10; // maksimal 10x untuk satu kehadiran
const notified={};
let audioCtx=null;

function unlockSound(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){console.warn("Audio tidak tersedia",e)}
}
function beep(){
  if(!audioCtx)return;
  try{
    const now=audioCtx.currentTime;
    [0,0.16,0.32].forEach((delay,i)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type="sine"; osc.frequency.value=i===1?880:660;
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(0.18,now+delay+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.14);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now+delay); osc.stop(now+delay+0.15);
    });
  }catch(e){}
}
function sendNotif(title,body,tag){
  beep();
  if("Notification"in window && Notification.permission==="granted")
    new Notification(title,{body,tag,requireInteraction:true});
}

function checkAutoNotifications(){
  const now=Date.now();
  data.forEach(d=>{
    const end=Number(d.waktuSelesai||0);
    if(!end || now<end)return;
    const key=d.id;
    const state=notified[key]||{count:0,last:0};
    if(state.count>=MAX_SPAM)return;
    if(!state.last || now-state.last>=SPAM_INTERVAL){
      state.count++; state.last=now; notified[key]=state;
      sendNotif("⏰ Waktu Kehadiran Habis",`${d.nama} • ${d.bidang} • waktu selesai sudah habis.`,\`osmia-${key}-${state.count}\`);
      info.textContent=`🔔 Notifikasi otomatis dikirim untuk ${d.nama} (${state.count}/${MAX_SPAM}).`;
    }
  });
}

setInterval(()=>{
  document.querySelectorAll(".count").forEach(el=>{
    const left=Number(el.dataset.end)-Date.now();
    el.textContent=countdown(left);
    const b=el.parentElement.querySelector(".badge");
    if(left<=0){b.textContent="WAKTU HABIS";b.className="badge off"}
  });
  checkAutoNotifications();
},1000);

$("notif").onclick=async()=>{
  unlockSound();
  beep();
  if(!("Notification"in window))return alert("Browser ini tidak mendukung notifikasi.");
  let permission=Notification.permission;
  if(permission!=="granted")permission=await Notification.requestPermission();
  if(permission!=="granted")return alert("Izin notifikasi belum diberikan.");
  try{
    if(await isSupported()){
      const sw=await navigator.serviceWorker.register("./firebase-messaging-sw.js");
      const messaging=getMessaging(app);
      const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:sw});
      console.log("FCM token:",token);
    }
    new Notification("🔔 OSMIAS Aktif",{body:"Notifikasi otomatis + suara sudah aktif. Jika waktu habis, pengingat akan muncul berkala.",requireInteraction:true});
    info.textContent="🔔 Notifikasi otomatis + suara aktif. Pengingat akan muncul setiap 30 detik sampai maksimal 10 kali.";
  }catch(e){console.error(e);alert("Notifikasi belum berhasil diaktifkan: "+e.message)}
};
</script>
